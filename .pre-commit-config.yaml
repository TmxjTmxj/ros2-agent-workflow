exclude: ^(assets/|examples/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        files: ^(agent_ros|mcp_server|tests)/
        args: [--fix]
      - id: ruff-format
        files: ^(agent_ros|mcp_server|tests)/
