name: hospital-delivery
robot_profile: hospital-amr
stages:
  - name: corridor-to-pharmacy
    goal:
      frame: odom
      x: 6.0
      y: 2.0
      yaw: 0.0
    tolerance: 0.50
    timeout: 60.0
  - name: pharmacy-to-ward-2
    goal:
      frame: odom
      x: 12.0
      y: 5.0
      yaw: 1.57
    tolerance: 0.50
    timeout: 60.0
  - name: ward-2-to-laboratory
    goal:
      frame: odom
      x: 18.0
      y: 2.0
      yaw: -1.57
    tolerance: 0.50
    timeout: 60.0
required_sensors:
  - odometry
  - camera
evidence:
  sources:
    - camera
    - odometry
recovery_policy: cancel_and_stop
