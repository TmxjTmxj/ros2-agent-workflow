<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">v0.1.1 的可验证发布闭环</title>
  <desc id="desc">从源码与测试，到构建 wheel 和源码包、校验 SHA256、发布 GitHub Release 的四步流程。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="1" stop-color="#102c42"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect x="34" y="32" width="7" height="296" rx="3.5" fill="url(#accent)"/>
  <text x="72" y="84" fill="#f8fafc" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700">v0.1.1 · 可验证发布闭环</text>
  <text x="72" y="117" fill="#a5bed0" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="17">每个发布产物都可回溯到固定标签、自动验证与校验和。</text>
  <g font-family="Inter, Noto Sans SC, Arial, sans-serif">
    <rect x="72" y="166" width="224" height="118" rx="18" fill="#12314b" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="96" y="207" fill="#5eead4" font-size="14" font-weight="700">01 · SOURCE</text>
    <text x="96" y="239" fill="#f8fafc" font-size="21" font-weight="700">主分支质量门禁</text>
    <text x="96" y="264" fill="#b8d3e2" font-size="14">测试 · 类型 · 审计</text>

    <rect x="352" y="166" width="224" height="118" rx="18" fill="#12314b" stroke="#60a5fa" stroke-opacity="0.55"/>
    <text x="376" y="207" fill="#93c5fd" font-size="14" font-weight="700">02 · BUILD</text>
    <text x="376" y="239" fill="#f8fafc" font-size="21" font-weight="700">wheel + sdist</text>
    <text x="376" y="264" fill="#b8d3e2" font-size="14">隔离安装 smoke test</text>

    <rect x="632" y="166" width="224" height="118" rx="18" fill="#12314b" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="656" y="207" fill="#c4b5fd" font-size="14" font-weight="700">03 · VERIFY</text>
    <text x="656" y="239" fill="#f8fafc" font-size="21" font-weight="700">SHA-256 清单</text>
    <text x="656" y="264" fill="#b8d3e2" font-size="14">元数据与产物完整性</text>

    <rect x="912" y="166" width="224" height="118" rx="18" fill="#12314b" stroke="#fbbf24" stroke-opacity="0.65"/>
    <text x="936" y="207" fill="#fcd34d" font-size="14" font-weight="700">04 · PUBLISH</text>
    <text x="936" y="239" fill="#f8fafc" font-size="21" font-weight="700">GitHub Release</text>
    <text x="936" y="264" fill="#b8d3e2" font-size="14">不可变标签 v0.1.1</text>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round">
    <path d="M304 225h32"/><path d="M584 225h32"/><path d="M864 225h32"/>
  </g>
  <g fill="#60a5fa">
    <path d="M337 217l11 8-11 8z"/><path d="M617 217l11 8-11 8z"/><path d="M897 217l11 8-11 8z"/>
  </g>
</svg>
