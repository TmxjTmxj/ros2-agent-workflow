<text x="585.0" y="334" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8b949e">硬件 Profile 已校验</text>
<rect x="270" y="470" width="190" height="82" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="365.0" y="502" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" font-weight="bold" fill="#58a6ff">STOPPED</text>
<text x="365.0" y="524" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8b949e">任务正常停止</text>
<rect x="690" y="470" width="190" height="82" rx="14" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
<text x="785.0" y="502" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" font-weight="bold" fill="#ff7b72">ESTOPPED</text>
<text x="785.0" y="524" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8b949e">急停闩锁</text>
<rect x="1000" y="470" width="190" height="82" rx="14" fill="#161b22" stroke="#d29922" stroke-width="2"/>
<text x="1095.0" y="502" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" font-weight="bold" fill="#d29922">FAULTED</text>
<text x="1095.0" y="524" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8b949e">心跳丢失 / 故障</text>
<line x1="250" y1="145" x2="330" y2="145" stroke="#8b949e" stroke-width="2.5" marker-end="url(#sGray)"/>
<text x="290" y="128" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8b949e">discover</text>
<path d="M 425 186 C 425 226, 585 226, 585 280" fill="none" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#sPurple)"/>
<text x="500" y="216" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="#bc8cff" fill="12">validate</text>
<text x="500" y="236" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="#8b949e" fill="11">hardware 模式</text>
<path d="M 585 280 C 585 330, 825 330, 825 186" fill="none" stroke="#d29922" stroke-width="2.5" marker-end="url(#sOrange)"/>
<text x="740" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="#d29922" fill="12">arm</text>
<text x="740" y="342" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="#8b949e" fill="11">operator challenge</text>
<line x1="520" y1="145" x2="730" y2="145" stroke="#3fb950" stroke-width="2.5" marker-end="url(#sGreen)"/>
<text x="625" y="128" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8b949e">validate（simulation 自动 arm）</text>
<line x1="920" y1="145" x2="980" y2="145" stroke="#3fb950" stroke-width="2.5" marker-end="url(#sGreen)"/>
<text x="950" y="128" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8b949e">start_task</text>
<path d="M 1080 186 C 1080 300, 365 310, 365 470" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#sBlue)"/>
<text x="655" y="282" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#58a6ff">cancel / succeed</text>
<path d="M 1120 186 C 1140 300, 785 300, 785 470" fill="none" stroke="#ff7b72" stroke-width="2.5" marker-end="url(#sRed)"/>
<text x="1015" y="282" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ff7b72">estop</text>
<path d="M 1130 186 C 1190 300, 1095 320, 1095 470" fill="none" stroke="#d29922" stroke-width="2.5" marker-end="url(#sOrange)"/>
<text x="1092" y="290" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#d29922">fault / heartbeat lost</text>
<path d="M 785 552 C 785 620, 160 620, 160 186" fill="none" stroke="#8b949e" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#sGray)"/>
<text x="480" y="622" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8b949e">operator_reset · 仅 simulation；hardware 必须人工复位</text>
<rect x="70" y="610" width="1060" height="46" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="140" y="639" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3fb950">●</text>
<text x="165" y="639" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8b949e">正常流程</text>
<text x="300" y="639" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ff7b72">●</text>
<text x="325" y="639" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8b949e">安全急停 / 故障</text>
<text x="500" y="639" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#bc8cff">●</text>
<text x="525" y="639" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8b949e">硬件校验</text>
<text x="700" y="639" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8b949e">- -</text>
<text x="745" y="639" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8b949e">恢复路径（simulation only）</text>
