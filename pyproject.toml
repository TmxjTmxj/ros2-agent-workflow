[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ros"
version = "0.1.0"
description = "Safe declarative control-plane primitives for ROS 2 robots"
requires-python = ">=3.11"
dependencies = [
    "FastMCP==3.4.7",
    "Pillow>=11.0",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agent_ros*", "mcp_server*"]
