name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  root-python-tests:
    name: Python ${{ matrix.python }} · root tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run root Python test suite
        run: python -m pytest tests/ -q

  hospital-case-static-tests:
    name: Hospital case static tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest PyYAML

      - name: Run hospital tests that do not need ROS2
        run: python -m pytest examples/hospital_delivery/tests/test_run_via_mcp.py examples/hospital_delivery/tests/test_model_geometry.py examples/hospital_delivery/tests/test_acceptance_report.py -q
