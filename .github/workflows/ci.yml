name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python }} · quality gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Create project virtualenv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install reproducible development toolchain
        run: .venv/bin/python -m pip install -e ".[dev]"

      - name: Run quality gates and installed-wheel smoke test
        run: |
          make check
          make smoke-wheel

      - name: Export coverage report
        if: matrix.python == '3.11'
        run: .venv/bin/python -m pytest --cov --cov-report=xml tests -q

      - name: Upload coverage report
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml

  hospital-case-static-tests:
    name: Python ${{ matrix.python }} · hospital static tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Create project virtualenv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install static hospital-test dependencies
        run: |
          .venv/bin/python -m pip install -e ".[dev]"
          .venv/bin/python -m pip install opencv-python-headless

      - name: Run hospital tests that do not need ROS 2
        run: >-
          .venv/bin/python -m pytest
          examples/hospital_delivery/tests/test_run_via_mcp.py
          examples/hospital_delivery/tests/test_model_geometry.py
          examples/hospital_delivery/tests/test_acceptance_report.py
          -q
